name: Build Penumbra

on:
  push:
    branches: [ actions ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Restore NuGet packages
      run: nuget restore Penumbra.sln

    - name: Build with MSBuild
      run: msbuild Penumbra.sln /p:Configuration=Release /p:Platform=Win32

    - name: Upload executable
    uses: actions/upload-artifact@v4
    with:
      name: Penumbra
      path: redist/Penumbra.exe
